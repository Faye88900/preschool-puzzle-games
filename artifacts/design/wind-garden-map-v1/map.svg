<!-- Design notes. -->
<rect x="1073" y="151" width="329" height="758" rx="26" fill="#fffdf7"/>
<text x="1100" y="196" class="tag">SPACE FIRST</text>
<text x="1100" y="236" class="label">先改空间，预留互动</text>
<path d="M1100 261H1375" stroke="#dce1d3"/>
<text x="1100" y="301" class="body" font-weight="700">01　入口有方向</text>
<text x="1100" y="330" class="small">浅色主路串联各个地标。</text>
<text x="1100" y="354" class="small">进来先看见花坛，再见庭院。</text>
<text x="1100" y="405" class="body" font-weight="700">02　战斗有空间</text>
<text x="1100" y="434" class="small">中央留空，圆花坛移向边缘。</text>
<text x="1100" y="458" class="small">入口可退回，残柱不堵走位。</text>
<text x="1100" y="509" class="body" font-weight="700">03　结束有停留点</text>
<text x="1100" y="538" class="small">凉亭与池水形成安静的落点。</text>
<text x="1100" y="562" class="small">宝箱可见，侧路可选。</text>
<text x="1100" y="613" class="body" font-weight="700">本轮预留，不自动新增</text>
<text x="1100" y="642" class="small">花儿唤醒 / 合唱 / 问答</text>
<text x="1100" y="666" class="small">风帆晶石 / 乘船 / 新出口</text>
<rect x="1094" y="705" width="287" height="175" rx="15" fill="#edf2e6"/>
<text x="1111" y="737" class="body" font-weight="700">落地前的灰盒检查</text>
<text x="1111" y="768" class="small">主路初定净宽 5 单位</text>
<text x="1111" y="793" class="small">验证盾兵警戒、退路和视线</text>
<text x="1111" y="818" class="small">验证手机镜头与柱子遮挡</text>
<text x="1111" y="853" class="small">上述尺寸均为待验证设计初值</text>
<text x="44" y="950" class="body">建议动线：入口 → 花坛缓冲 → 盾兵庭院 → 凉亭休息 → 原有后续路线</text>
<text x="44" y="978" class="small">当前交付：地图设计方案。游戏源文件、碰撞与关卡流程尚未修改。码头仅为景观预留，不表示新增通关路线。</text>
